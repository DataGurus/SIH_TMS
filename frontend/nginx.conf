server {
  listen 80;
  server_name localhost;

  # Set the root directory for the static files
  root /usr/share/nginx/html;
  index index.html;

  # Configure routing for a Single Page Application (SPA)
  # This ensures that all routes are directed to index.html
  # so the client-side router can handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Add cache control headers for static assets to improve performance
  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public";
  }
}
